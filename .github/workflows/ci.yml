name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: npm install -g @elgato/cli
      - name: Validate plugins
        run: |
          for dir in plugins/*/*.sdPlugin; do
            echo "validating $dir"
            streamdeck validate "$dir" || exit 1
          done

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm install -g @elgato/cli
      # streamdeck pack rewrites manifest.json in place (reformats indentation,
      # drops the trailing newline) before packing, so the packed artifact's
      # manifest formatting will differ from the tracked source in git.
      - name: Pack plugins
        run: |
          for dir in plugins/*/*.sdPlugin; do
            streamdeck pack "$dir" --output dist-packs || exit 1
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-packs/*.streamDeckPlugin
